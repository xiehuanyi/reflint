[project]
name = "reflint"
version = "0.1.0"
description = "RefLint — a citation-integrity agent that reads every reference in your paper and checks it against the record"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Huanyi Xie" }]
dependencies = [
    "strands-agents[gemini]>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
reflint = "reflint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflint"]
